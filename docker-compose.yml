services:
  postgres:
    image: postgres:17
    container_name: pointclick_postgres
    restart: always
    environment:
      POSTGRES_DB: pointclick
      POSTGRES_USER: pointclick_user
      POSTGRES_PASSWORD: pointclick_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pointclick_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres

volumes:
  postgres_data: